name: Deploy to GitHub Pages

# 画面（web/）と静的データを GitHub Pages に置く。探索はブラウザ内で行うのでサーバーは要らない。
# データはリポジトリに入れず、デプロイのたびにほこナビDP（CKAN）から取って作る
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --no-dev

      # 歩行空間ネットワークデータ（nwd_*）の全地区。ID を共有する地区は 1 つにまとめる（28 → 21 地区）
      - name: データを取って静的ファイルを作る
        run: |
          uv run python preprocess/fetch_hokonavi.py
          uv run python preprocess/build_network.py --all
          uv run python preprocess/export_static.py --all

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm build
        working-directory: web
        env:
          # https://<owner>.github.io/<リポジトリ名>/ の「/<リポジトリ名>」
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
